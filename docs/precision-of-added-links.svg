<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .teal { fill: #1b7d6e; }
      .rust { fill: #b8431f; }
      .title { fill: #2b3a35; font-weight: 800; }
      .sub   { fill: #51605a; font-weight: 400; }
      .lbl   { fill: #2b3a35; font-weight: 700; }
      .mut   { fill: #8a988f; font-weight: 400; }
      .val   { fill: #ffffff; font-weight: 800; }
      .grid  { stroke: #e3e8e6; stroke-width: 1; }
      .whisk { stroke: #0f3d36; stroke-width: 2.5; fill: none; }
      .mono  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="6" y="6" width="988" height="428" rx="18" fill="#ffffff" stroke="#e3e8e6" stroke-width="2"/>

  <text x="40" y="62" class="title" font-size="30">Precision of the links the model adds</text>
  <text x="40" y="94" class="sub" font-size="19">Share judged the same owner · 95% intervals · stratified sample of 150 pairs · recall not estimated</text>

  <line class="grid" x1="330" y1="118" x2="330" y2="352"/>
  <line class="grid" x1="450" y1="118" x2="450" y2="352"/>
  <line class="grid" x1="570" y1="118" x2="570" y2="352"/>
  <line class="grid" x1="690" y1="118" x2="690" y2="352"/>
  <line class="grid" x1="810" y1="118" x2="810" y2="352"/>
  <line class="grid" x1="930" y1="118" x2="930" y2="352"/>

  <text x="40" y="146" class="lbl" font-size="22">All sampled links</text>
  <text x="40" y="168" class="mut mono" font-size="15">150 pairs</text>
  <rect class="teal" x="330" y="135" width="560" height="30" rx="4"/>
  <text x="344" y="157" class="val" font-size="19">97%</text>
  <path class="whisk" d="M 839 150 L 913 150 M 839 142 L 839 158 M 913 142 L 913 158"/>

  <text x="40" y="206" class="lbl" font-size="22">Across WoW portfolios</text>
  <text x="40" y="228" class="mut mono" font-size="15">67 pairs</text>
  <rect class="teal" x="330" y="195" width="546" height="30" rx="4"/>
  <text x="344" y="217" class="val" font-size="19">96%</text>
  <path class="whisk" d="M 782 210 L 912 210 M 782 202 L 782 218 M 912 202 L 912 218"/>

  <text x="40" y="266" class="lbl" font-size="22">via name + address</text>
  <text x="40" y="288" class="mut mono" font-size="15">of the 67 · 49 pairs</text>
  <rect class="teal" x="330" y="255" width="600" height="30" rx="4"/>
  <text x="344" y="277" class="val" font-size="19">100%</text>
  <path class="whisk" d="M 843 270 L 930 270 M 843 262 L 843 278 M 930 262 L 930 278"/>

  <text x="40" y="326" class="lbl" font-size="22">via shared company</text>
  <text x="40" y="348" class="mut mono" font-size="15">of the 67 · 18 pairs</text>
  <rect class="rust" x="330" y="315" width="400" height="30" rx="4"/>
  <text x="344" y="337" class="val" font-size="19">83%</text>
  <path class="whisk" d="M 459 330 L 860 330 M 459 322 L 459 338 M 860 322 L 860 338"/>

  <text x="330" y="378" class="mut mono" font-size="15" text-anchor="middle">50%</text>
  <text x="450" y="378" class="mut mono" font-size="15" text-anchor="middle">60%</text>
  <text x="570" y="378" class="mut mono" font-size="15" text-anchor="middle">70%</text>
  <text x="690" y="378" class="mut mono" font-size="15" text-anchor="middle">80%</text>
  <text x="810" y="378" class="mut mono" font-size="15" text-anchor="middle">90%</text>
  <text x="930" y="378" class="mut mono" font-size="15" text-anchor="middle">100%</text>

  <text x="40" y="414" class="mut" font-size="16">Labels: one human annotator; a blind second reader is planned. The split by stage was made after the errors were seen (exploratory).</text>
</svg>
