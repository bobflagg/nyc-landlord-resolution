[project]
name = "nyc-landlord-resolution"
version = "0.1.0"
description = "Precision-first probabilistic resolution of NYC landlord/owner identities from public HPD records."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Robert Flagg" }]
keywords = ["record-linkage", "entity-resolution", "splink", "nyc", "housing", "hpd"]
dependencies = [
    "splink>=4.0.16",
    "psycopg2-binary>=2.9.12",
    "pandas>=2.0",
    "duckdb>=1.0",          # explicit: the DuckDB-native CSV path is the next milestone
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlr"]

[tool.hatch.build.targets.wheel.force-include]
"src/nlr/eval/gold_set.csv" = "nlr/eval/gold_set.csv"
